[package]
edition = "2024"
name = "ble-scanner"
rust-version = "1.95"
version = "0.1.0"

[[bin]]
name = "ble-scanner"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["defmt", "esp32", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "defmt",
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32",
] }

defmt = "1.0.1"
esp-bootloader-esp-idf = { version = "0.6.0", features = ["defmt", "esp32"] }
esp-backtrace = { version = "0.20.0", features = ["esp32", "defmt"] }

bt-hci = "0.9.0"
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-futures = "0.1.2"
embassy-time = { version = "0.5.0", features = ["defmt"] }
embedded-io = { version = "0.7.1", features = ["defmt"] }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
esp-alloc = { version = "0.11.0", features = ["defmt", "esp32"] }
esp-println = { version = "0.18.0", features = ["defmt-espflash", "esp32"] }
esp-radio = { version = "1.0.0-beta.1", features = [
  "ble",
  "defmt",
  "esp-alloc",
  "esp32",
  "unstable",
] }
trouble-host = { version = "0.7.0", features = ["gatt", "scan", "defmt"] }

critical-section = "1.2.0"
static_cell = "2.1.1"
heapless = "0.9.3"

[patch.crates-io]
# esp-wifi-sys based on a rom that is only present in the upstream
# https://github.com/esp-rs/esp-wifi-sys/pull/508
# https://github.com/esp-rs/esp-hal/pull/6271
# pinning to a commit that has the correct linker scripts in esp-rom-sys
esp-rom-sys = { git = "https://github.com/esp-rs/esp-hal.git", rev = "6fedea34e2244a40ea653c226258473aa3ff5e14" }


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = 2         # prefer slower builds but better debugging experience
lto = 'fat'
opt-level = 's'
